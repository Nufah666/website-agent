<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Website Builder</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="builder">

      <h1>AI Website Builder</h1>

      <p class="subtitle">
        Describe any website you want to create.
        Our AI will help turn your idea into a professional website.
      </p>

      <textarea
        id="prompt"
        placeholder="Example: Create a modern luxury restaurant website with animations, elegant typography, menu section, gallery, location and contact form..."
      ></textarea>

      <button id="generate">
        Generate Website
      </button>

      <div id="output">
        Your website generation result will appear here.
      </div>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
